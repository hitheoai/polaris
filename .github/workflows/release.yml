name: Release

# Disabled in private/unconfigured repositories and on tag pushes. Publication requires
# manual approval from a matching version tag in the explicitly approved public repository:
#
#   build  -> checks, tests and builds the public wheel and source archive (no credentials)
#   pypi   -> uploads them to PyPI with Trusted Publishing; PyPI stores a signed attestation of
#             where each file came from (Sigstore). Needs approval in the `pypi` environment.
#   sign   -> GitHub build provenance, a Sigstore bundle per file and SHA256SUMS, attached to a
#             draft GitHub release
#
# Not run yet. It needs the one-time setup in docs/releasing.md (a PyPI trusted publisher and a
# protected `pypi` environment). No API tokens or secrets are used anywhere.
#
# Every action is pinned to a full commit, and values reach shell scripts only through
# environment variables, never by `${{ }}` interpolation.

on:
  workflow_dispatch:
    inputs:
      approve_publication:
        description: Publish the reviewed version from this exact version tag
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    if: inputs.approve_publication && !github.event.repository.private && github.repository == vars.PUBLIC_RELEASE_REPOSITORY && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # release builds never restore caches

      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          package=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/polaris/__init__.py)
          if [ "v$version" != "$TAG" ] || [ "$package" != "$version" ]; then
            echo "::error::The tag ($TAG), pyproject.toml ($version) and polaris.__version__ ($package) must agree."
            exit 1
          fi

      - name: Lint, type-check and test
        run: |
          uv sync --locked --extra api --extra mcp --extra tui
          uv run --locked --extra api --extra mcp --extra tui ruff check .
          uv run --locked --extra api --extra mcp --extra tui mypy src
          uv run --locked --extra api --extra mcp --extra tui pytest -q

      - name: Build the public wheel and source archive
        run: uv run --locked python scripts/build_public_wheel.py --out-dir dist --sdist

      - name: Install the wheel in a clean environment and review a risky sample
        run: |
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          mkdir /tmp/smoke/sample
          printf 'import os\n\n\ndef ping(host):\n    os.system("ping -c 1 " + host)\n' > /tmp/smoke/sample/app.py
          cd /tmp/smoke/sample
          status=0
          /tmp/smoke/bin/polaris scan . --engine rules --no-cache || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::The installed package should flag the sample (exit 1), not exit $status."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/theovex-polaris/
    permissions:
      id-token: write # Trusted Publishing and PyPI attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # With Trusted Publishing this also signs and uploads an attestation for every file.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  sign:
    name: Sign and draft the GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing
      attestations: write # GitHub build provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Writes dist/<file>.sigstore.json next to each file.
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
          release-signing-artifacts: false

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Polaris $TAG" \
            --notes "Each file has a Sigstore bundle (.sigstore.json) and a line in SHA256SUMS. How to verify them: docs/releasing.md."
