name: Verify approved macOS publication inputs

# This verifies supplied bytes; it never claims CI built them, signs code, or uploads to a public origin.
# Provision a protected Apple Silicon release runner and approval environment before enabling.
on:
  workflow_dispatch:
    inputs:
      input_run_id:
        description: Approved artifact run containing the signed bundle and bound acceptance evidence
        type: string
        required: true
      approve_preparation:
        type: boolean
        default: false
        required: true

permissions: {}
concurrency:
  group: macos-release-verification
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.approve_preparation && github.repository == vars.MACOS_RELEASE_REPOSITORY && vars.MACOS_RELEASE_CONFIG_PATH != ''
    runs-on: [self-hosted, macOS, ARM64, polaris-release]
    environment: macos-release-approval
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approved-macos-inputs
          path: ${{ runner.temp }}/approved-macos-inputs-${{ github.run_id }}
          run-id: ${{ inputs.input_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and prepare without publishing or asserting build provenance
        env:
          INPUT: ${{ runner.temp }}/approved-macos-inputs-${{ github.run_id }}
          OUTPUT: ${{ runner.temp }}/polaris-publication-kit-${{ github.run_id }}-${{ github.run_attempt }}
          CONFIG: ${{ vars.MACOS_RELEASE_CONFIG_PATH }}
        run: |
          uv run --no-project --python 3.11 python scripts/prepare_release_publication.py \
            --bundle-dir "$INPUT/bundle" --dmg-dir "$INPUT/dmg" \
            --homebrew-dir "$INPUT/homebrew" --public-dir "$INPUT/public" \
            --acceptance-dir "$INPUT/acceptance" --config "$CONFIG" \
            --output "$OUTPUT" --approve-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-publication-kit
          path: ${{ runner.temp }}/polaris-publication-kit-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
